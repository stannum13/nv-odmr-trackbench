name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build pytest ruff
      - run: python -m build --wheel
      - run: python -m pip install dist/*.whl
      - run: odmrbench --version
      - run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              assert "odmr_bench/configs/drift.yaml" in archive.namelist()
          PY
      - run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install dist/*.whl
          (
            cd "$smoke_dir"
            "$smoke_dir/venv/bin/odmrbench" simulate --config bundled:drift
          )
      - run: ruff check .
      - run: pytest
